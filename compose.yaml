services:
  condor:
    image: ghcr.io/zyairexv/condor:latest
    init: false # tini is already the image entrypoint
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      CONDOR_MODE: local
      ADMIN_USER_ID: "1"
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8088"
      WEB_URL: http://localhost:8088
      CONDOR_TELEMETRY: "off"
    volumes:
      - condor-data:/app/data
      - condor-runtime:/app/.condor
      - condor-reports:/app/reports
    stop_grace_period: 60s

volumes:
  condor-data:
  condor-runtime:
  condor-reports:
